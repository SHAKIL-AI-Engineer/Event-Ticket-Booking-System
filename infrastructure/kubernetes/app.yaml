# Apply only after creating the eventhub-secrets Secret and pushing your images.
# Supply managed SQL Server, Redis, and RabbitMQ through those secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhub-api
spec:
  replicas: 1
  selector: { matchLabels: { app: eventhub-api } }
  template:
    metadata: { labels: { app: eventhub-api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/shakil-ai-engineer/eventhub-api:1.0.0
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: Production }
            - { name: DatabaseProvider, value: SqlServer }
          envFrom: [{ secretRef: { name: eventhub-secrets } }]
          readinessProbe:
            {
              httpGet: { path: /health, port: 8080 },
              initialDelaySeconds: 15,
              periodSeconds: 10,
            }
          livenessProbe:
            {
              tcpSocket: { port: 8080 },
              initialDelaySeconds: 30,
              periodSeconds: 15,
            }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata: { name: eventhub-api }
spec:
  selector: { app: eventhub-api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: eventhub-web }
spec:
  replicas: 1
  selector: { matchLabels: { app: eventhub-web } }
  template:
    metadata: { labels: { app: eventhub-web } }
    spec:
      containers:
        - name: web
          # Build with API_INTERNAL_URL=http://eventhub-api:8080.
          image: ghcr.io/shakil-ai-engineer/eventhub-web:1.0.0
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            {
              httpGet: { path: /, port: 3000 },
              initialDelaySeconds: 10,
              periodSeconds: 10,
            }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: eventhub-web }
spec:
  selector: { app: eventhub-web }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventhub
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/affinity: cookie
spec:
  ingressClassName: nginx
  tls: [{ hosts: [tickets.example.com], secretName: eventhub-tls }]
  rules:
    - host: tickets.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: eventhub-api, port: { number: 8080 } } }
          - path: /hubs
            pathType: Prefix
            backend: { service: { name: eventhub-api, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: eventhub-web, port: { number: 3000 } } }
