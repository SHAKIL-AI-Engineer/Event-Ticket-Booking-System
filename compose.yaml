name: eventhub
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q ''SELECT 1'' -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: eventhub
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/EventHub.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DatabaseProvider: SqlServer
      ConnectionStrings__Database: "Server=sqlserver;Database=EventHub;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      TicketSigningKey: ${TICKET_SIGNING_KEY:?Set TICKET_SIGNING_KEY in .env}
      Redis__Connection: redis:6379,abortConnect=false,connectTimeout=1000
      RabbitMQ__Url: "amqp://eventhub:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      Payments__Provider: ${PAYMENT_PROVIDER:-Sandbox}
      Payments__StripeSecretKey: ${STRIPE_SECRET_KEY:-}
      Payments__StripePublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Payments__StripeWebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      PublicOrigin: ${PUBLIC_ORIGIN:-}
      Bootstrap__AdminEmail: ${ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:-}
    depends_on:
      sqlserver: { condition: service_healthy }
      redis: { condition: service_started }
      rabbitmq: { condition: service_started }
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args: { API_INTERNAL_URL: "http://api:8080" }
    depends_on: [api]
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    ports: ["8080:8080"]
    volumes: ["./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      [
        "./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro",
      ]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local-eventhub-change-me}
    volumes:
      - ./infrastructure/monitoring/datasources.yaml:/etc/grafana/provisioning/datasources/eventhub.yaml:ro
    ports: ["127.0.0.1:3001:3000"]
volumes:
  sql-data:
  redis-data:
  rabbit-data:
